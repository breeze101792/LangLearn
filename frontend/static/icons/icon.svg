<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="LangLearn">
  <title>LangLearn</title>
  <!-- Background: rounded square in the brand accent color -->
  <rect x="0" y="0" width="64" height="64" rx="12" fill="#3B4D8C"/>
  <!-- Open book base -->
  <path d="M10 22 C 18 18, 30 18, 32 22 L 32 50 C 30 46, 18 46, 10 50 Z"
        fill="#FAF8F4" />
  <path d="M54 22 C 46 18, 34 18, 32 22 L 32 50 C 34 46, 46 46, 54 50 Z"
        fill="#FFFFFF" />
  <!-- Spine shadow -->
  <path d="M32 22 L 32 50" stroke="#3B4D8C" stroke-width="1" opacity="0.25"/>
  <!-- Glyph "Aa" on the left page -->
  <text x="16" y="38"
        font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
        font-size="14" font-weight="700" fill="#3B4D8C" letter-spacing="-0.5">Aa</text>
  <!-- Glyph "文" on the right page (a hint of multi-language) -->
  <text x="40" y="38"
        font-family="ui-sans-serif, system-ui, -apple-system, sans-serif"
        font-size="14" font-weight="700" fill="#3B4D8C">文</text>
</svg>